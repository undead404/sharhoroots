configuration:
  pageTitle: Генеалогія Шаргородщини
  pageTitleSuffix: " | Генеалогія Шаргородщини"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: uk-UA
  baseUrl: sharhoroots.koreni.org.ua
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/*.excalidraw.md"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Source Sans 3
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fcfcfc"
        lightgray: "#e5e5e5"
        gray: "#a3a3a3"
        darkgray: "#404040"
        dark: "#171717"
        secondary: "#2f5c7a"
        tertiary: "#5a8c82"
        highlight: rgba(47, 92, 122, 0.08)
        textHighlight: rgba(255, 242, 54, 0.5)
      darkMode:
        light: "#121212"
        lightgray: "#262626"
        gray: "#737373"
        darkgray: "#d4d4d4"
        dark: "#f5f5f5"
        secondary: "#8ab4f8"
        tertiary: "#84a59d"
        highlight: rgba(138, 180, 248, 0.15)
        textHighlight: rgba(179, 170, 2, 0.5)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  # Core theme typography loads the fonts and supplies sans-serif fallbacks.
  # The optional fonts plugin overrides those settings with independent defaults.
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
    options:
      sortFn: >-
        (a, b) => {
         const order = { map: 0, author: 1, 'settlement/index': 2, 'registrar/index': 3, 'administrative-division/index': 4 };
         const first = order[a.slug] ?? Infinity;
         const second = order[b.slug] ?? Infinity;
         return first !== second ? first - second : a.displayName.localeCompare(b.displayName, 'uk', { numeric: true, sensitivity: 'base' });
        }
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Генеалогія Шаргородщини на Facebook: https://www.facebook.com/groups/1748115539548381
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: ./plugins/places-map
    enabled: true
    layout:
      position: beforeBody
      priority: 40
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
